[package]
name = "vyron-ide"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "VYRON IDE - a graphite, Rust-rendered browser IDE"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "persistence", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
tree-sitter = "0.24"
tree-sitter-rust = "0.24.2"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
thiserror = "2"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
walkdir = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlInputElement", "HtmlCanvasElement", "File", "FileList", "FileReader",
  "Event", "EventTarget", "Blob", "console", "Storage", "Location"
] }
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
